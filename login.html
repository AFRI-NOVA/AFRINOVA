<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration | AFRINOVA</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        linear-gradient(135deg, rgba(0,0,0,.75), rgba(18,97,160,.7)),
        url("plateforme.jpg") center/cover;
}

.login-box {
    width: 92%;
    max-width: 430px;
    background: white;
    padding: 45px;
    border-radius: 22px;
    box-shadow: 0 25px 70px rgba(0,0,0,.25);
}

.login-logo {
    display: block;
    width: 150px;
    max-height: 70px;
    object-fit: contain;
    margin: 0 auto 30px;
}

.login-box h1 {
    text-align: center;
    margin-bottom: 10px;
}

.login-box p {
    text-align: center;
    color: #64748b;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

.form-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

.form-group input:focus {
    border-color: #1261a0;
}

.login-button {
    width: 100%;
    border: none;
    cursor: pointer;
    background: #111827;
    color: white;
    padding: 15px;
    border-radius: 30px;
    font-weight: bold;
    font-size: 15px;
}

.login-button:hover {
    background: #1261a0;
}

.error {
    color: #dc2626;
    text-align: center;
    margin-top: 15px;
    display: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #1261a0;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="login-box">

    <img src="logo2.jpg" class="login-logo" alt="AFRINOVA">

    <h1>Administration</h1>

    <p>Accès réservé aux administrateurs</p>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Identifiant</label>

            <input
                type="text"
                id="username"
                placeholder="Identifiant"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                required
            >
        </div>

        <button class="login-button" type="submit">
            Se connecter
        </button>

        <div id="errorMessage" class="error">
            Identifiant ou mot de passe incorrect.
        </div>

    </form>

    <a href="index.html" class="back">
        ← Retour au site
    </a>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    /*
       IDENTIFIANTS DE DÉMONSTRATION

       À CHANGER AVANT LA MISE EN PRODUCTION.
    */

    const ADMIN_USERNAME = "admin";
    const ADMIN_PASSWORD = "Afrinova2026!";

    if (
        username === ADMIN_USERNAME &&
        password === ADMIN_PASSWORD
    ) {

        sessionStorage.setItem("afrinovaAdmin", "true");

        window.location.href = "admin.html";

    } else {

        document.getElementById("errorMessage").style.display = "block";

    }

});

</script>

</body>
</html>
