<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AFRINOVA — Administration</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#101828;
}

button,input,textarea,select{
    font:inherit;
}

.header{
    background:#ffffff;
    border-bottom:1px solid #e5e7eb;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    width:120px;
    height:55px;
    object-fit:contain;
}

.container{
    width:92%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:white;
    border-radius:14px;
    padding:25px;
    margin-bottom:25px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

h1{
    font-size:26px;
    margin-bottom:8px;
}

h2{
    font-size:22px;
    margin-bottom:8px;
}

.description{
    color:#667085;
    margin-bottom:25px;
    font-size:14px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

.field{
    margin-bottom:18px;
}

input,
textarea,
select{
    width:100%;
    border:1px solid #d0d5dd;
    border-radius:8px;
    padding:13px;
    outline:none;
    background:white;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#111827;
}

textarea{
    min-height:160px;
    resize:vertical;
}

button{
    border:0;
    border-radius:8px;
    padding:13px 20px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#111827;
    color:white;
}

.secondary{
    background:#eaecf0;
    color:#101828;
}

.danger{
    background:#b42318;
    color:white;
}

.message{
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    display:none;
    font-size:14px;
}

.success{
    background:#ecfdf3;
    color:#027a48;
}

.error{
    background:#fef3f2;
    color:#b42318;
}

.preview{
    width:100%;
    max-height:300px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
    display:none;
}

.post{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    margin-top:12px;
}

.post img{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:12px;
}

.post h3{
    margin-bottom:7px;
}

.post-meta{
    color:#667085;
    font-size:12px;
    margin-bottom:10px;
}

.post-content{
    white-space:pre-wrap;
    font-size:14px;
    line-height:1.6;
    margin-bottom:15px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

#dashboard{
    display:none;
}

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 15px 50px rgba(0,0,0,.1);
}

.login .logo{
    display:block;
    margin:0 auto 20px;
}

.login h1{
    text-align:center;
}

.login p{
    text-align:center;
    color:#667085;
    font-size:14px;
    margin-bottom:25px;
}

.login button{
    width:100%;
}

@media(max-width:600px){
    .header{
        padding:12px;
    }

    .container{
        width:94%;
        margin-top:20px;
    }

    .card{
        padding:18px;
    }
}
</style>
</head>

<body>

<!-- =========================
     PAGE DE CONNEXION
========================= -->

<div id="loginPage">

    <div class="login">

        <img
            src="logo2.jpg"
            class="logo"
            alt="AFRINOVA"
        >

        <h1>Administration</h1>

        <p>
            Connectez-vous pour gérer les publications AFRINOVA.
        </p>

        <div
            id="loginMessage"
            class="message error"
        ></div>

        <div class="field">
            <label for="username">
                Identifiant
            </label>

            <input
                id="username"
                type="text"
                placeholder="Identifiant"
                autocomplete="username"
            >
        </div>

        <div class="field">
            <label for="password">
                Mot de passe
            </label>

            <input
                id="password"
                type="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
            >
        </div>

        <button
            id="loginButton"
            class="primary"
            type="button"
        >
            Se connecter
        </button>

    </div>

</div>


<!-- =========================
     TABLEAU DE BORD
========================= -->

<div id="dashboard">

    <header class="header">

        <img
            src="logo2.jpg"
            class="logo"
            alt="AFRINOVA"
        >

        <button
            id="logoutButton"
            class="secondary"
            type="button"
        >
            Déconnexion
        </button>

    </header>


    <main class="container">

        <!-- PUBLICATION -->

        <section class="card">

            <h1 id="formTitle">
                Nouvelle publication
            </h1>

            <p class="description">
                Publiez une actualité directement sur votre espace AFRINOVA.
            </p>

            <div
                id="publicationMessage"
                class="message"
            ></div>

            <form id="publicationForm">

                <input
                    type="hidden"
                    id="editId"
                >

                <div class="field">

                    <label for="title">
                        Titre
                    </label>

                    <input
                        id="title"
                        type="text"
                        placeholder="Titre de la publication"
                        required
                    >

                </div>


                <div class="field">

                    <label for="category">
                        Catégorie
                    </label>

                    <select id="category">

                        <option value="Actualité">
                            Actualité
                        </option>

                        <option value="Innovation">
                            Innovation
                        </option>

                        <option value="Technologie">
                            Technologie
                        </option>

                        <option value="Événement">
                            Événement
                        </option>

                        <option value="Communiqué">
                            Communiqué
                        </option>

                    </select>

                </div>


                <div class="field">

                    <label for="image">
                        Image
                    </label>

                    <input
                        id="image"
                        type="file"
                        accept="image/*"
                    >

                    <img
                        id="preview"
                        class="preview"
                        alt="Aperçu"
                    >

                </div>


                <div class="field">

                    <label for="content">
                        Contenu
                    </label>

                    <textarea
                        id="content"
                        placeholder="Écrivez votre publication..."
                        required
                    ></textarea>

                </div>


                <div class="actions">

                    <button
                        id="publishButton"
                        type="submit"
                        class="primary"
                    >
                        Publier
                    </button>

                    <button
                        id="cancelButton"
                        type="button"
                        class="secondary"
                    >
                        Annuler
                    </button>

                </div>

            </form>

        </section>


        <!-- LISTE -->

        <section class="card">

            <h2>
                Publications
            </h2>

            <p class="description">
                Les publications enregistrées sur cet appareil.
            </p>

            <div id="postsList"></div>

        </section>

    </main>

</div>


<script src="./admin.js"></script>

</body>
</html>
